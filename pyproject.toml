[project]
name = "io-mineria-codigo"
version = "0.1.0"
description = "Comparacion de tecnicas de clustering para la segmentacion de estudiantes"
requires-python = ">=3.11,<3.12"
dependencies = [
    "matplotlib",
    "numpy",
    "pandas",
    "scikit-learn",
    "scipy",
    "seaborn",
]

[dependency-groups]
antecedentes = ["python-glmnet==2.6.1"]
dev = [
    "ipykernel>=7.4.0",
    "pytest",
    "ruff",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
